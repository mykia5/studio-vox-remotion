name: Rendu Video Vox-Style

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code et les assets
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances du projet
        run: npm ci

      - name: Rendre la vidéo finale avec Remotion
        run: npx remotion render VoxExplainer out/video_finale.mp4

      - name: Sauvegarder la vidéo pour téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: video-vox-finale
          path: out/video_finale.mp4
